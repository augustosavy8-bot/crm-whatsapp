<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foko · Panel de Operaciones</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0b; --surface:#141416; --surface-2:#1b1b1e;
  --glass:rgba(255,255,255,.035); --border:rgba(255,255,255,.09);
  --border-str:rgba(255,255,255,.16);
  --accent:#ff6b00; --accent-dim:#ff8c3f; --accent-glow:rgba(255,107,0,.18);
  --text:#ededed; --muted:#7c7c84; --faint:#54545a;
  --ok:#34d399; --warn:#fbbf24; --danger:#f87171; --info:#60a5fa; --violet:#a78bfa;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --display:'Space Grotesk',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--text);font-family:var(--body);
  font-size:14px;line-height:1.5;min-height:100vh;
  background-image:radial-gradient(1200px 600px at 85% -10%, rgba(255,107,0,.07), transparent 60%);
}
::selection{background:var(--accent-glow);color:#fff}
button{font-family:inherit;cursor:pointer;color:inherit;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:13px}
a{color:var(--accent-dim);text-decoration:none}
.mono{font-family:var(--mono)}

/* ---------- Layout ---------- */
#app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{
  border-right:1px solid var(--border);background:linear-gradient(180deg,#0c0c0d,#090909);
  padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:9px;padding:6px 8px 18px;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.02em}
.brand .dot{width:11px;height:11px;border-radius:3px;background:var(--accent);box-shadow:0 0 14px var(--accent)}
.brand small{font-family:var(--mono);font-weight:500;font-size:9.5px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;display:block;margin-top:2px}
.nav-lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);padding:14px 8px 6px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;color:var(--muted);font-weight:500;font-size:13.5px;transition:.15s;position:relative}
.nav-item svg{width:17px;height:17px;flex:0 0 auto;stroke-width:1.8}
.nav-item:hover{background:var(--glass);color:var(--text)}
.nav-item.active{background:var(--accent-glow);color:#fff}
.nav-item.active::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--accent)}
.nav-item .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--surface-2);padding:1px 7px;border-radius:20px;border:1px solid var(--border)}
.nav-item.active .cnt{color:var(--accent-dim)}

.main{display:flex;flex-direction:column;min-width:0}

/* ---------- Status line (signature) ---------- */
.statusline{
  font-family:var(--mono);font-size:12px;border-bottom:1px solid var(--border);
  background:linear-gradient(90deg,rgba(255,107,0,.05),transparent 55%);
  padding:11px 26px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;color:var(--muted);
}
.statusline .prompt{color:var(--accent)}
.statusline b{color:var(--text);font-weight:600}
.statusline .seg{color:var(--muted)}
.statusline .cursor{width:8px;height:15px;background:var(--accent);display:inline-block;animation:blink 1.1s steps(1) infinite;margin-left:2px;border-radius:1px}
@keyframes blink{50%{opacity:0}}

.view{padding:26px 30px 60px;max-width:1180px;width:100%}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.view-head h1{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:-.03em}
.view-head .sub{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:9px;font-weight:600;font-size:13px;transition:.15s;border:1px solid transparent}
.btn svg{width:15px;height:15px;stroke-width:2}
.btn-primary{background:var(--accent);color:#160a00;box-shadow:0 2px 18px var(--accent-glow)}
.btn-primary:hover{background:var(--accent-dim);transform:translateY(-1px)}
.btn-ghost{border-color:var(--border-str);color:var(--muted)}
.btn-ghost:hover{color:var(--text);border-color:var(--accent);background:var(--glass)}
.btn-icon{padding:6px;border-radius:7px;color:var(--muted)}
.btn-icon:hover{color:var(--text);background:var(--glass)}
.btn-icon.del:hover{color:var(--danger);background:rgba(248,113,113,.1)}

/* ---------- Cards / stats ---------- */
.grid{display:grid;gap:14px}
.stats{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:26px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:17px 18px;position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;inset:0;background:radial-gradient(300px 120px at 100% 0,var(--accent-glow),transparent 70%);opacity:0;transition:.3s}
.stat:hover::after{opacity:.6}
.stat .k{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:-.03em;margin-top:8px;line-height:1}
.stat .v.money{font-size:24px}
.stat .foot{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:8px}
.stat .foot.up{color:var(--ok)} .stat .foot.down{color:var(--danger)}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border)}
.panel-head h3{font-family:var(--display);font-size:15px;font-weight:600}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.two-col{grid-template-columns:1fr}}

/* mini list (dashboard) */
.mini{padding:6px 8px}
.mini-row{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px}
.mini-row:hover{background:var(--glass)}
.mini-row .txt{min-width:0}
.mini-row .txt .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-row .txt .m{font-family:var(--mono);font-size:11px;color:var(--muted)}
.mini-row .when{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);white-space:nowrap}

/* ---------- Toolbar / table ---------- */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:8px 12px;flex:1;min-width:180px;max-width:340px}
.search svg{width:15px;height:15px;color:var(--muted)}
.search input{background:none;border:none;color:var(--text);outline:none;width:100%}
.chip{font-family:var(--mono);font-size:12px;padding:7px 13px;border-radius:8px;border:1px solid var(--border);color:var(--muted);transition:.15s}
.chip:hover{color:var(--text);border-color:var(--border-str)}
.chip.on{background:var(--accent-glow);color:var(--accent-dim);border-color:transparent}

.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:14px;background:var(--surface)}
table{width:100%;border-collapse:collapse;min-width:640px}
thead th{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:12px 16px;border-bottom:1px solid var(--border);font-weight:600;white-space:nowrap}
tbody td{padding:13px 16px;border-bottom:1px solid rgba(255,255,255,.045);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--glass)}
td .primary{font-weight:600}
td .sub2{font-family:var(--mono);font-size:11px;color:var(--muted)}
.acts{display:flex;gap:2px;justify-content:flex-end}
td.num{font-family:var(--mono);text-align:right;white-space:nowrap}
.pos{color:var(--ok)} .neg{color:var(--danger)}

/* badges */
.badge{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;font-weight:500;padding:3px 9px;border-radius:20px;border:1px solid transparent;white-space:nowrap;text-transform:capitalize}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-grey{color:var(--muted);background:rgba(124,124,132,.12)}
.b-orange{color:var(--accent-dim);background:rgba(255,107,0,.13)}
.b-blue{color:var(--info);background:rgba(96,165,250,.13)}
.b-violet{color:var(--violet);background:rgba(167,139,250,.14)}
.b-green{color:var(--ok);background:rgba(52,211,153,.13)}
.b-yellow{color:var(--warn);background:rgba(251,191,36,.13)}
.b-red{color:var(--danger);background:rgba(248,113,113,.13)}
.recur{font-family:var(--mono);font-size:10px;color:var(--accent-dim);border:1px solid rgba(255,107,0,.3);border-radius:5px;padding:1px 5px;margin-left:6px}

/* empty / loading */
.empty{text-align:center;padding:54px 20px;color:var(--muted)}
.empty svg{width:38px;height:38px;color:var(--faint);margin-bottom:14px;stroke-width:1.5}
.empty h4{font-family:var(--display);font-size:16px;color:var(--text);margin-bottom:5px}
.empty p{font-size:13px;max-width:340px;margin:0 auto 16px}
.spinner{width:26px;height:26px;border:2.5px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:44px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:60;opacity:0;pointer-events:none;transition:.18s}
.overlay.show{opacity:1;pointer-events:auto}
.modal{background:var(--surface);border:1px solid var(--border-str);border-radius:16px;width:100%;max-width:520px;max-height:90vh;overflow:auto;transform:translateY(10px) scale(.99);transition:.18s}
.overlay.show .modal{transform:none}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface)}
.modal-head h3{font-family:var(--display);font-size:17px;font-weight:600}
.modal-body{padding:18px 20px;display:grid;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field.row2{grid-column:span 2}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field label{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:10px 12px;color:var(--text);outline:none;transition:.15s;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.field textarea{resize:vertical;min-height:72px;font-family:var(--body)}
.field .check{display:flex;align-items:center;gap:9px;cursor:pointer;color:var(--text);font-size:13px}
.field .check input{width:16px;height:16px;accent-color:var(--accent)}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 20px;border-top:1px solid var(--border)}

/* setup screen */
.setup{max-width:460px;margin:9vh auto;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:32px}
.setup h2{font-family:var(--display);font-size:22px;margin-bottom:6px}
.setup p{color:var(--muted);font-size:13px;margin-bottom:22px}
.setup .field{margin-bottom:14px}
.setup .hint{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:18px;line-height:1.7}

/* toast */
#toasts{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:10px;z-index:90}
.toast{background:var(--surface-2);border:1px solid var(--border-str);border-left:3px solid var(--accent);border-radius:10px;padding:12px 16px;font-size:13px;min-width:220px;box-shadow:0 10px 40px rgba(0,0,0,.5);animation:slidein .25s;font-family:var(--mono);font-size:12px}
.toast.err{border-left-color:var(--danger)} .toast.ok{border-left-color:var(--ok)}
@keyframes slidein{from{transform:translateX(20px);opacity:0}}

@media(max-width:760px){
  #app{grid-template-columns:1fr}
  .side{position:fixed;z-index:50;transform:translateX(-100%);transition:.2s;width:232px}
  .side.open{transform:none}
  .view{padding:20px 16px 50px}
  .form-grid{grid-template-columns:1fr}
  .field.row2{grid-column:span 1}
  .menu-btn{display:inline-flex!important}
}
.menu-btn{display:none}
</style>
</head>
<body>

<div id="root"></div>
<div id="toasts"></div>

<script>
/* =====================================================================
   FOKO · Panel de Operaciones
   ===================================================================== */

/* ---- storage (a prueba de sandbox) ---- */
const store = {
  get(k){ try{ return localStorage.getItem(k) }catch{ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch{} },
  del(k){ try{ localStorage.removeItem(k) }catch{} }
};

let sb = null;
let SB_URL = store.get('foko_url') || '';
let SB_KEY = store.get('foko_key') || '';

/* ---- iconos (lucide-ish) ---- */
const I = {
  dash:'<path d="M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z"/>',
  box:'<path d="M21 8V6a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 6v12a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 18Z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/>',
  megaphone:'<path d="m3 11 18-5v12L3 14v-3zM11.6 16.8a3 3 0 1 1-5.8-1.6"/>',
  wrench:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3 17.8 6.2 21l6.3-6.3a4 4 0 0 0 5.2-5.4l-2.6 2.6-2.1-2.1z"/>',
  wallet:'<path d="M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5"/><path d="M18 12h.01"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-2.7-1.1l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7H1a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.1-2.7l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H7a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  edit:'<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/>',
  trash:'<path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>',
  search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  inbox:'<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.5 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.5A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.5z"/>',
  menu:'<path d="M3 12h18M3 6h18M3 18h18"/>'
};
const icon = (p,cls='')=>`<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;

/* ---- helpers ---- */
const $ = s=>document.querySelector(s);
const money = n => '$'+Number(n||0).toLocaleString('es-AR',{maximumFractionDigits:0});
const esc = s => (s??'').toString().replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const todayISO = ()=>new Date().toISOString().slice(0,10);
function fmtDate(d){ if(!d) return '—'; const [y,m,dd]=d.split('-'); return `${dd}/${m}`; }
function daysUntil(d){ if(!d) return null; const t=new Date(todayISO()); const x=new Date(d); return Math.round((x-t)/864e5); }
function relLabel(d){ const n=daysUntil(d); if(n===null) return '—'; if(n<0) return `hace ${-n}d`; if(n===0) return 'hoy'; if(n===1) return 'mañana'; return `en ${n}d`; }
function toast(msg,type=''){ const t=document.createElement('div'); t.className='toast '+type; t.textContent=msg; $('#toasts').append(t); setTimeout(()=>{t.style.opacity=0;t.style.transform='translateX(20px)';setTimeout(()=>t.remove(),250)},2600); }

/* ---- badge color maps ---- */
const BADGE = {
  estado_amz:{pendiente:'b-grey',en_proceso:'b-orange',revision:'b-blue',entregado:'b-green'},
  estado_pub:{idea:'b-grey','diseño':'b-orange',aprobado:'b-blue',programado:'b-violet',publicado:'b-green'},
  estado_web:{ok:'b-green',pendiente:'b-yellow',urgente:'b-red'},
  estado_fin:{pendiente:'b-yellow',cobrado:'b-green',pagado:'b-blue'},
  prioridad:{baja:'b-grey',media:'b-blue',alta:'b-red'},
  tipo_fin:{ingreso:'b-green',egreso:'b-red'}
};
const badge = (map,val)=>`<span class="badge ${BADGE[map]?.[val]||'b-grey'}">${esc(String(val||'').replace('_',' '))}</span>`;

/* =====================================================================
   ENTIDADES  (config-driven CRUD)
   ===================================================================== */
const OPT = {
  tipo_amz:['catalogo','a+','a+ premium','imagenes','video'],
  estado_amz:['pendiente','en_proceso','revision','entregado'],
  prioridad:['baja','media','alta'],
  cuenta:['Bingo','Metalúrgica Las Malvinas'],
  tipo_pub:['feed','story','reel','carrusel'],
  estado_pub:['idea','diseño','aprobado','programado','publicado'],
  estado_web:['ok','pendiente','urgente'],
  tipo_fin:['ingreso','egreso'],
  estado_fin:['pendiente','cobrado','pagado'],
  medio:['transferencia','efectivo','mercadopago','otro']
};

const ENTITIES = {
  entregas_amazon:{
    label:'Amazon', icon:I.box, title:'Entregas Amazon',
    sub:'catálogo · A+ · imágenes', order:{col:'fecha_entrega',asc:true},
    search:['marca','producto'],
    fields:[
      {k:'marca',l:'Marca',t:'text',req:true},
      {k:'producto',l:'Producto',t:'text'},
      {k:'tipo',l:'Tipo',t:'select',o:OPT.tipo_amz,def:'catalogo'},
      {k:'prioridad',l:'Prioridad',t:'select',o:OPT.prioridad,def:'media'},
      {k:'estado',l:'Estado',t:'select',o:OPT.estado_amz,def:'pendiente'},
      {k:'fecha_entrega',l:'Fecha entrega',t:'date'},
      {k:'notas',l:'Notas',t:'textarea',row2:true}
    ],
    cols:[
      {h:'Marca / Producto',r:x=>`<div class="primary">${esc(x.marca)}</div><div class="sub2">${esc(x.producto)||'—'}</div>`},
      {h:'Tipo',r:x=>`<span class="mono" style="font-size:12px">${esc(x.tipo)}</span>`},
      {h:'Prioridad',r:x=>badge('prioridad',x.prioridad)},
      {h:'Estado',r:x=>badge('estado_amz',x.estado)},
      {h:'Entrega',r:x=>`<span class="mono" style="font-size:12px">${fmtDate(x.fecha_entrega)}<br><span style="color:var(--muted);font-size:10px">${relLabel(x.fecha_entrega)}</span></span>`}
    ]
  },
  publicaciones:{
    label:'Publicaciones', icon:I.megaphone, title:'Publicaciones',
    sub:'bingo · metalúrgica', order:{col:'fecha',asc:true},
    search:['titulo','cuenta','copy'], filterField:'cuenta', filterOpts:OPT.cuenta,
    fields:[
      {k:'cuenta',l:'Cuenta',t:'select',o:OPT.cuenta,def:'Bingo',req:true},
      {k:'tipo',l:'Formato',t:'select',o:OPT.tipo_pub,def:'feed'},
      {k:'titulo',l:'Título',t:'text',row2:true},

/* =====================================================================
   DATA LAYER
   ===================================================================== */
const cache = {}; // table -> rows
async function loadAll(){
  const tables = Object.keys(ENTITIES);
  await Promise.all(tables.map(async t=>{
    const {data,error} = await sb.from(t).select('*');
    if(error){ console.error(t,error); toast('Error cargando '+t,'err'); cache[t]=[]; }
    else cache[t]=data||[];
  }));
}
async function saveRow(table,row,id){
  if(id){ const {error}=await sb.from(table).update(row).eq('id',id); if(error) throw error; }
  else { const {error}=await sb.from(table).insert(row); if(error) throw error; }
}
async function deleteRow(table,id){ const {error}=await sb.from(table).delete().eq('id',id); if(error) throw error; }

/* =====================================================================
   STATE + RENDER
   ===================================================================== */
let route = 'dashboard';
const uiState = {}; // per-table: {search, filter}

function orderRows(table){
  const {col,asc}=ENTITIES[table].order;
  return [...(cache[table]||[])].sort((a,b)=>{
    const av=a[col]??'', bv=b[col]??'';
    if(av===bv) return (b.id||0)-(a.id||0);
    if(av==='') return 1; if(bv==='') return -1;
    return asc ? (av>bv?1:-1) : (av<bv?1:-1);
  });
}

/* ---- statusline signature ---- */
function statusline(){
  const amz = (cache.entregas_amazon||[]).filter(x=>x.estado!=='entregado').length;
  const pub = (cache.publicaciones||[]).filter(x=>x.estado!=='publicado').length;

  const mrr = (cache.finanzas||[]).filter(x=>x.recurrente&&x.tipo==='ingreso').reduce((s,x)=>s+Number(x.monto||0),0);
  return `<div class="statusline">
    <span class="prompt">foko@panel</span><span class="seg">:~$</span>
    <span class="seg">status</span>
    <span>· <b>${amz}</b> entregas</span>
    <span>· <b>${pub}</b> posts</span>
    <span>· <b>${web}</b> webs</span>

}

/* ---- dashboard ---- */
function dashboard(){
  const F=cache.finanzas||[];
  const now=new Date(); const mm=now.toISOString().slice(0,7);
  const inMonth=x=>(x.fecha||'').slice(0,7)===mm;
  const ingresos=F.filter(x=>x.tipo==='ingreso'&&x.estado==='cobrado'&&inMonth(x)).reduce((s,x)=>s+ +x.monto,0);
  const egresos=F.filter(x=>x.tipo==='egreso'&&x.estado==='pagado'&&inMonth(x)).reduce((s,x)=>s+ +x.monto,0);
  const balance=ingresos-egresos;
  const mrr=F.filter(x=>x.recurrente&&x.tipo==='ingreso').reduce((s,x)=>s+ +x.monto,0);
  const porCobrar=F.filter(x=>x.tipo==='ingreso'&&x.estado==='pendiente').reduce((s,x)=>s+ +x.monto,0);

  const amzPend=(cache.entregas_amazon||[]).filter(x=>x.estado!=='entregado');
  const pubPend=(cache.publicaciones||[]).filter(x=>x.estado!=='publicado');
  const webAlert=(cache.mantenimientos_web||[]).filter(x=>x.estado==='urgente'||(daysUntil(x.proximo_mantenimiento)!==null&&daysUntil(x.proximo_mantenimiento)<=7));

  const stat=(k,v,foot,fc='',money2=false)=>`<div class="stat"><div class="k">${k}</div><div class="v ${money2?'money':''}">${v}</div>${foot?`<div class="foot ${fc}">${foot}</div>`:''}</div>`;

  const miniList=(rows,mapper,emptyTxt)=>rows.length?rows.slice(0,5).map(mapper).join('')
    :`<div style="padding:26px 16px;text-align:center;color:var(--faint);font-size:13px">${emptyTxt}</div>`;

  const amzMini=x=>`<div class="mini-row"><div class="txt"><div class="t">${esc(x.marca)} · ${esc(x.producto)||x.tipo}</div><div class="m">${esc(x.tipo)}</div></div>${badge('estado_amz',x.estado)}<span class="when">${relLabel(x.fecha_entrega)}</span></div>`;
  const pubMini=x=>`<div class="mini-row"><div class="txt"><div class="t">${esc(x.titulo)||x.cuenta}</div><div class="m">${esc(x.cuenta)} · ${esc(x.tipo)}</div></div>${badge('estado_pub',x.estado)}<span class="when">${relLabel(x.fecha)}</span></div>`;
  const webMini=x=>`<div class="mini-row"><div class="txt"><div class="t">${esc(x.sitio)}</div><div class="m">${esc(x.cliente)||'—'}</div></div>${badge('estado_web',x.estado)}<span class="when">${relLabel(x.proximo_mantenimiento)}</span></div>`;

  return `<div class="view">
    <div class="view-head"><div><h1>Dashboard</h1><div class="sub">${new Date().toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})}</div></div></div>
    <div class="grid stats">
      ${stat('Balance del mes',money(balance),`${money(ingresos)} in · ${money(egresos)} out`,balance>=0?'up':'down',true)}
      ${stat('MRR recurrente',money(mrr),'ingresos fijos/mes','up',true)}
      ${stat('Por cobrar',money(porCobrar),'ingresos pendientes','',true)}
      ${stat('Entregas Amazon',amzPend.length,'pendientes')}
      ${stat('Publicaciones',pubPend.length,'sin publicar')}
      ${stat('Webs a revisar',webAlert.length,'urgentes / próx. 7d',webAlert.length?'down':'up')}
    </div>
    <div class="grid two-col">
      <div class="panel"><div class="panel-head"><h3>Próximas entregas Amazon</h3><button class="btn btn-ghost" onclick="go('entregas_amazon')">Ver todo</button></div><div class="mini">${miniList(amzPend.sort((a,b)=>(a.fecha_entrega||'z')>(b.fecha_entrega||'z')?1:-1),amzMini,'Nada pendiente 🎉')}</div></div>
      <div class="panel"><div class="panel-head"><h3>Publicaciones en cola</h3><button class="btn btn-ghost" onclick="go('publicaciones')">Ver todo</button></div><div class="mini">${miniList(pubPend.sort((a,b)=>(a.fecha||'z')>(b.fecha||'z')?1:-1),pubMini,'Sin publicaciones cargadas')}</div></div>
    </div>
    <div class="grid" style="margin-top:14px">
      <div class="panel"><div class="panel-head"><h3>Mantenimientos que piden atención</h3><button class="btn btn-ghost" onclick="go('mantenimientos_web')">Ver todo</button></div><div class="mini">${miniList(webAlert.sort((a,b)=>(a.proximo_mantenimiento||'z')>(b.proximo_mantenimiento||'z')?1:-1),webMini,'Todos los sitios al día ✓')}</div></div>
    </div>
  </div>`;
}

/* ---- generic entity view ---- */
function entityView(table){
  const E=ENTITIES[table];
  const st=uiState[table]||(uiState[table]={search:'',filter:''});
  let rows=orderRows(table);
  if(st.filter) rows=rows.filter(x=>x[E.filterField]===st.filter);
  if(st.search){ const q=st.search.toLowerCase(); rows=rows.filter(x=>E.search.some(f=>(x[f]||'').toString().toLowerCase().includes(q))); }

  const filterChips = E.filterField ? `
    <button class="chip ${!st.filter?'on':''}" onclick="setFilter('${table}','')">Todas</button>
    ${E.filterOpts.map(o=>`<button class="chip ${st.filter===o?'on':''}" onclick="setFilter('${table}','${o}')">${esc(o)}</button>`).join('')}` : '';

  const head=`<tr>${E.cols.map(c=>`<th${c.cls==='num'?' style="text-align:right"':''}>${c.h}</th>`).join('')}<th style="text-align:right">Acciones</th></tr>`;
  const body = rows.length ? rows.map(x=>`<tr>
    ${E.cols.map(c=>`<td${c.cls==='num'?' class="num"':''}>${c.r(x)}</td>`).join('')}
    <td><div class="acts">
      <button class="btn-icon" title="Editar" onclick="openForm('${table}',${x.id})">${icon(I.edit)}</button>
      <button class="btn-icon del" title="Borrar" onclick="askDelete('${table}',${x.id})">${icon(I.trash)}</button>
    </div></td></tr>`).join('')
    : `<tr><td colspan="${E.cols.length+1}"><div class="empty">${icon(I.inbox)}<h4>No hay nada acá todavía</h4><p>Cargá tu primer registro y empezá a llevar el control.</p><button class="btn btn-primary" style="margin:auto" onclick="openForm('${table}')">${icon(I.plus)} Agregar</button></div></td></tr>`;

  return `<div class="view">
    <div class="view-head"><div><h1>${E.title}</h1><div class="sub">${E.sub}</div></div>
      <button class="btn btn-primary" onclick="openForm('${table}')">${icon(I.plus)} Agregar</button></div>
    <div class="toolbar">
      <div class="search">${icon(I.search)}<input placeholder="Buscar…" value="${esc(st.search)}" oninput="setSearch('${table}',this.value)"></div>
      ${filterChips}
    </div>
    <div class="tbl-wrap"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>
  </div>`;
}

    <div class="panel" style="max-width:560px"><div class="modal-body" style="padding:22px">
      <div class="field"><label>Supabase URL</label><input id="cfgUrl" value="${esc(SB_URL)}" placeholder="https://xxxx.supabase.co"></div>

      <div class="setup hint" style="margin:0;padding:16px 0 0">// Se guardan en este navegador (localStorage).<br>// Corré el panel con un server local, ej:<br>&nbsp;&nbsp;python -m http.server 5500<br>// o la extensión Live Server de VS Code.</div>

/* ---- shell render ---- */
function render(){
  let content;
  if(route==='dashboard') content=dashboard();
  else if(route==='config') content=configView();
  else content=entityView(route);
  $('#root').innerHTML=`<div id="app">
    ${sidebar()}
    <div class="main">
      <button class="menu-btn btn btn-ghost" style="margin:12px" onclick="document.getElementById('side').classList.toggle('open')">${icon(I.menu)}</button>

/* =====================================================================
   ACTIONS
   ===================================================================== */
window.go=r=>{ route=r; render(); const s=document.getElementById('side'); if(s)s.classList.remove('open'); };
window.setSearch=(t,v)=>{ uiState[t].search=v; const el=document.activeElement; render(); const inp=$('.search input'); if(inp){inp.focus();inp.setSelectionRange(v.length,v.length);} };
window.setFilter=(t,v)=>{ uiState[t].filter=v; render(); };

/* modal form */
let editing={table:null,id:null};
window.openForm=(table,id=null)=>{
  editing={table,id};
  const E=ENTITIES[table];
  const row = id ? (cache[table].find(x=>x.id===id)||{}) : {};
  const fld=f=>{
    const val = row[f.k] ?? f.def ?? '';
    if(f.t==='check') return `<div class="field row2"><label class="check"><input type="checkbox" data-k="${f.k}" ${row[f.k]?'checked':''}><span>${f.checkLabel}</span></label></div>`;
    let input;
    if(f.t==='select') input=`<select data-k="${f.k}">${f.o.map(o=>`<option ${val===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
    else if(f.t==='textarea') input=`<textarea data-k="${f.k}">${esc(val)}</textarea>`;
    else input=`<input type="${f.t}" data-k="${f.k}" value="${esc(val)}" ${f.t==='number'?'step="any"':''}>`;
    return `<div class="field ${f.row2?'row2':''}"><label>${f.l}${f.req?' *':''}</label>${input}</div>`;
  };
  const html=`<div class="overlay" id="ov"><div class="modal">
    <div class="modal-head"><h3>${id?'Editar':'Nuevo'} · ${E.label}</h3><button class="btn-icon" onclick="closeForm()">${icon(I.x)}</button></div>
    <div class="modal-body"><div class="form-grid">${E.fields.map(fld).join('')}</div></div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeForm()">Cancelar</button><button class="btn btn-primary" onclick="submitForm()">${id?'Guardar cambios':'Crear'}</button></div>
  </div></div>`;
  document.body.insertAdjacentHTML('beforeend',html);
  requestAnimationFrame(()=>$('#ov').classList.add('show'));
  $('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeForm();});
};
window.closeForm=()=>{ const o=$('#ov'); if(o){o.classList.remove('show');setTimeout(()=>o.remove(),180);} };
window.submitForm=async()=>{
  const E=ENTITIES[editing.table]; const row={};
  $('#ov').querySelectorAll('[data-k]').forEach(el=>{
    const k=el.dataset.k;
    if(el.type==='checkbox') row[k]=el.checked;
    else if(el.type==='number') row[k]=el.value===''?null:Number(el.value);
    else row[k]=el.value===''?null:el.value;
  });
  const missing=E.fields.filter(f=>f.req&&!row[f.k]);
  if(missing.length){ toast('Falta: '+missing.map(f=>f.l).join(', '),'err'); return; }
  try{
    await saveRow(editing.table,row,editing.id);
    const {data}=await sb.from(editing.table).select('*'); cache[editing.table]=data||[];
    closeForm(); render(); toast(editing.id?'Guardado ✓':'Creado ✓','ok');
  }catch(e){ console.error(e); toast('Error al guardar: '+(e.message||''),'err'); }
};
window.askDelete=async(table,id)=>{
  if(!confirm('¿Borrar este registro? No se puede deshacer.')) return;
  try{ await deleteRow(table,id); cache[table]=cache[table].filter(x=>x.id!==id); render(); toast('Borrado','ok'); }
  catch(e){ toast('Error al borrar','err'); }
};

/* config save */
window.saveCfg=()=>{
  const url=$('#cfgUrl').value.trim(), key=$('#cfgKey').value.trim();
  if(!url||!key){ toast('Completá URL y key','err'); return; }
  store.set('foko_url',url); store.set('foko_key',key);
  SB_URL=url; SB_KEY=key; boot();
};

/* =====================================================================
   BOOT
   ===================================================================== */
function setupScreen(){
  $('#root').innerHTML=`<div class="setup">
    <h2>Conectá tu Supabase</h2>
    <p>Pegá la URL y la anon key de tu proyecto para arrancar. Se guardan solo en este navegador.</p>
    <div class="field"><label>Supabase URL</label><input id="cfgUrl" placeholder="https://xxxx.supabase.co"></div>
    <div class="field"><label>Anon / publishable key</label><input id="cfgKey" placeholder="eyJh...  o  sb_publishable_..."></div>
    <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:6px" onclick="saveCfg()">Conectar</button>
    <div class="hint">// Supabase → Project Settings → API<br>// Antes corré el schema.sql en el SQL Editor.<br>// Servilo local: python -m http.server 5500</div>
  </div>`;
}

async function boot(){
  if(!SB_URL||!SB_KEY){ setupScreen(); return; }
  try{ sb=window.supabase.createClient(SB_URL,SB_KEY); }
  catch(e){ toast('URL/key inválidas','err'); setupScreen(); return; }
  $('#root').innerHTML='<div class="spinner"></div>';
  try{
    await loadAll();
    // detectar error de conexión (todas vacías + credenciales nuevas) no es fatal; solo render
    render();
  }catch(e){ console.error(e); toast('No pude conectar. Revisá URL/key y RLS.','err'); render(); }
}

boot();
</script>
